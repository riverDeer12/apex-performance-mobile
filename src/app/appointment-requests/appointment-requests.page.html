<ion-content [fullscreen]="true" class="ion-no-padding">
  <ion-refresher slot="fixed"
                 (ionRefresh)="loadAppointmentRequests($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <ion-list class="ion-padding-vertical">
    <p class="ion-padding-horizontal" *ngIf="!appointmentRequests?.length">There are no appointment requests.</p>
    <ion-item-sliding *ngFor="let appointmentRequest of appointmentRequests">
      <ion-item [button]="true">
        <ion-avatar slot="start">
          <img [src]="'assets/icon/' + appointmentRequest.type.description + '.png'" alt="">
        </ion-avatar>
        <ion-label [style]="getTextColor(appointmentRequest)">{{ appointmentRequest.status.name }}
          at {{ appointmentRequest.updatedAt | date: 'dd.MM.yyyy HH:mm' }}
        </ion-label>
      </ion-item>
      <ion-item-options slot="end">
        <ion-item-option color="info" expandable="true">
          <ion-icon slot="icon-only" name="information-circle-outline"
                    (click)="openInfoModal(appointmentRequest)"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>
</ion-content>

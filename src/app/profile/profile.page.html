<ion-content [fullscreen]="true" class="ion-no-padding">
  <ion-list [inset]="true">
    <ion-item>
      <ion-label> Firstname</ion-label>
      {{ currentClient?.firstName }}
    </ion-item>
    <ion-item>
      <ion-label>Lastname</ion-label>
      {{ currentClient?.lastName }}
    </ion-item>
    <ion-item>
      <ion-label>Credits</ion-label>
      {{ currentClient?.credits }}
    </ion-item>
    <ion-item>
      <ion-button (click)="logOut()">
        Logout
        <ion-icon slot="end" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-item>
    <ion-item>
      <ion-button (click)="requestPasswordChange()">
        Change Password
        <ion-icon slot="end" name="create-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>

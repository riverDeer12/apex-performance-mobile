<ion-list class="ion-padding-vertical">
  <h5 class="ion-padding-horizontal">{{ type }}</h5>
  <p class="ion-padding-horizontal" *ngIf="!appointments?.length">There are no {{ type }} appointments.</p>
  <ion-item-sliding *ngFor="let appointment of appointments">
    <ion-item [button]="true">
      <ion-avatar slot="start">
        <img [src]="'assets/icon/' + appointment.type.description + '.png'" alt="">
      </ion-avatar>
      <ion-label>{{ appointment.startTime | date: 'dd.MM.yyyy' }}
      </ion-label>
      <ion-label>{{ appointment.startTime | date: 'HH:mm' }} - {{ appointment.endTime | date: 'HH:mm' }}
      </ion-label>
      <ion-label>
            <span *ngFor="let client of appointment.coaches">
              <p>{{ client.firstName }} {{ client.lastName }}</p>
            </span>
      </ion-label>
    </ion-item>
    <ion-item-options slot="end">
      <ion-item-option color="danger" expandable="true" (click)="confirmCancelation(appointment.id)">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-item-option>
    </ion-item-options>
  </ion-item-sliding>
</ion-list>

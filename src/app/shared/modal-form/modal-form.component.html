<ion-content [fullscreen]="true" class="ion-padding">
  <app-appointment-form
    *ngIf="type === entityType.Appointment"
    [currentClient]="currentClient"
  ></app-appointment-form>
  <app-appointment-request-cancelation-form
    *ngIf="type === entityType.AppointmentRequest"
    [currentClient]="currentClient"
    [appointmentId]="appointmentId"
  ></app-appointment-request-cancelation-form>
</ion-content>
